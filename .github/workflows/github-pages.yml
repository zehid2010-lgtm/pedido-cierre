name: Deploy Pedido Sugerido to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static SPA
        env:
          GITHUB_PAGES: "true"
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          SHELL_FILE="$(find dist .output -type f -name "_shell.html" 2>/dev/null | head -n 1 || true)"
          if [ -n "$SHELL_FILE" ]; then
            STATIC_DIR="$(dirname "$SHELL_FILE")"
            cp -a "$STATIC_DIR"/. _site/
            cp "$SHELL_FILE" _site/index.html
            cp "$SHELL_FILE" _site/404.html
          else
            INDEX_FILE="$(find dist .output -type f -name "index.html" 2>/dev/null | head -n 1 || true)"
            if [ -z "$INDEX_FILE" ]; then
              echo "No static HTML output found."
              find dist .output -maxdepth 4 -type f 2>/dev/null | sort | head -n 200
              exit 1
            fi
            STATIC_DIR="$(dirname "$INDEX_FILE")"
            cp -a "$STATIC_DIR"/. _site/
            cp "$INDEX_FILE" _site/404.html
          fi

          mkdir -p _site/importar-v21
          cp _site/index.html _site/importar-v21/index.html
          mkdir -p _site/importar-v22
          cp _site/index.html _site/importar-v22/index.html
          mkdir -p _site/importar-v23
          cp _site/index.html _site/importar-v23/index.html

          touch _site/.nojekyll
          echo "Prepared GitHub Pages artifact:"
          find _site -maxdepth 2 -type f | sort | head -n 100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
